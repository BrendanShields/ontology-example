# Workspace root. Nothing is published from here: it only ties the members
# together and holds the tooling configuration shared by the whole monorepo.
[project]
name = "ontology-example"
version = "0.1.0"
description = "Example monorepo: ontology-driven development of a call quality assurance agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[tool.uv.sources]
onto-cli = { workspace = true }
call-qa-agent = { workspace = true }

[dependency-groups]
dev = [
    "onto-cli[gen]",
    "call-qa-agent",
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "import-linter>=2",
]

[tool.pytest.ini_options]
testpaths = ["packages/onto/tests", "apps/call-qa-agent/tests", "ontology/cq"]
addopts = "--import-mode=importlib -q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated from the ontology by `onto gen`: never formatted or edited by hand.
extend-exclude = ["apps/call-qa-agent/src/call_qa_agent/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# An assertion reads best on one line, even a long one.
"**/tests/**" = ["E501"]
"ontology/cq/test_*.py" = ["E501"]

# The layering of each app, checked by `lint-imports`. check-terms checks the names
# a domain layer uses. These check what it is allowed to reach.
[tool.importlinter]
root_packages = ["call_qa_agent"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "call-qa: the domain layer reaches only the generated types"
type = "forbidden"
source_modules = ["call_qa_agent.domain"]
forbidden_modules = [
    "call_qa_agent.agent",
    "call_qa_agent.tools",
    "call_qa_agent.session",
    "call_qa_agent.ledger",
    "call_qa_agent.cli",
    "call_qa_agent.replay",
    "call_qa_agent.prompts",
    "anthropic",
]

# The domain layer decides and keeps nothing: it is handed what it needs, the time
# included, and whoever calls it does the reading and the writing. `datetime` is not
# listed because the domain layer needs the type: nothing here stops datetime.now().
[[tool.importlinter.contracts]]
name = "call-qa: the domain layer reads and writes nothing"
type = "forbidden"
source_modules = ["call_qa_agent.domain"]
# What the generated types import to be types is not the domain layer's doing.
allow_indirect_imports = true
forbidden_modules = [
    "pathlib",
    "os",
    "io",
    "sys",
    "json",
    "yaml",
    "logging",
    "time",
    "shutil",
    "tempfile",
    "subprocess",
    "socket",
    "sqlite3",
    "urllib",
    "http",
    "httpx2",
]

[[tool.importlinter.contracts]]
name = "call-qa: the generated types import no app module"
type = "forbidden"
source_modules = ["call_qa_agent.generated"]
forbidden_modules = [
    "call_qa_agent.domain",
    "call_qa_agent.agent",
    "call_qa_agent.tools",
    "call_qa_agent.session",
    "call_qa_agent.ledger",
    "call_qa_agent.cli",
    "call_qa_agent.replay",
    "call_qa_agent.prompts",
    "anthropic",
]

[[tool.importlinter.contracts]]
name = "call-qa: each layer imports only the layers below it"
type = "layers"
layers = [
    "call_qa_agent.cli",
    "call_qa_agent.replay",
    "call_qa_agent.agent",
    "call_qa_agent.prompts",
    "call_qa_agent.tools",
    # Two adapters over the domain layer that know nothing of each other: the write path
    # of Findings, and the ledger of Reviews and AuditRecords.
    "call_qa_agent.session | call_qa_agent.ledger",
    "call_qa_agent.domain",
    "call_qa_agent.generated",
]

[[tool.importlinter.contracts]]
name = "call-qa: the ledger reaches only the domain layer and the generated types"
type = "forbidden"
source_modules = ["call_qa_agent.ledger"]
forbidden_modules = [
    "call_qa_agent.agent",
    "call_qa_agent.tools",
    "call_qa_agent.session",
    "call_qa_agent.cli",
    "call_qa_agent.replay",
    "call_qa_agent.prompts",
    "anthropic",
]
