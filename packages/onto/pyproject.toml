[project]
name = "onto-cli"
version = "0.1.0"
description = "Deterministic ontology gates: typed work items, domain-term checks and a traceability graph"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23",
    "linkml-runtime>=1.12",
    "pyoxigraph>=0.5",
    "pyshacl>=0.40",
    "pyyaml>=6",
    "rdflib>=7.1",
]

[project.optional-dependencies]
# Only `onto gen` needs the LinkML generators. The gates run on what it generated.
gen = ["linkml>=1.12"]

[project.scripts]
onto = "onto.cli:main"

[project.entry-points.pytest11]
onto = "onto.pytest_plugin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onto"]
