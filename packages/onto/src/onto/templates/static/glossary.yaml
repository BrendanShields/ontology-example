# Glossary of the "{{context}}" bounded context.
#
# This file is the single source of the context's language. Every class, slot,
# enum and permissible value below is a glossary term: its name is the only
# name requirements and domain-layer code may use for that concept.
#
#   description          the definition shown to people and to agents (`onto slice`)
#   aliases              other spellings that resolve to the term (`onto resolve`)
#   annotations
#     classification     PII | confidential | internal | public (default: internal)
#     denied_synonyms    names that must not be used; `onto check-terms` blocks them
#     binding            rule (an enum or a value) | computed (a slot): `onto rules` holds
#                        the term to a function that produces it and to a Requirement,
#                        verified by a passing Test, that uses it. The first binding also
#                        needs `bindings_json` under [contexts.{{context}}] in onto.toml
#
# `onto gen` compiles it into the Pydantic types and the JSON Schema named under
# [contexts.{{context}}] in onto.toml.
#
# The three terms below are placeholders written by `onto init`. Change the file
# only through an OntologyChangeRequest: `onto ocr new --context {{context}} ...`.
id: {{base_uri}}/ontology/{{context}}
name: {{context}}
title: Glossary of the {{context}} bounded context
description: >-
  Starter glossary written by `onto init`. An Item has an Owner and may carry
  Labels. Replace these terms with the language of the domain.
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  {{prefix}}: {{base_uri}}/ontology/{{context}}/
default_prefix: {{prefix}}
default_range: string

imports:
  - linkml:types

classes:
  Item:
    description: >-
      One thing the system keeps track of.
    aliases:
      - entry

  Owner:
    description: >-
      The person or team answerable for an Item.
    annotations:
      denied_synonyms: [Holder]

  Label:
    description: >-
      A word attached to an Item to group it with other Items.
