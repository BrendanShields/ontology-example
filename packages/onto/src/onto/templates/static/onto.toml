# The ontology layer of this repository: where it lives and which code each
# bounded context governs. Every `onto` command, every hook and CI read this file.

[workflow]
schema = "ontology/workflow.yaml"                       # the workflow ontology, shared by every context
json_schema = "ontology/schemas/workflow.schema.json"   # generated by `onto gen`
shacl = "ontology/shapes/workflow.shacl.ttl"            # generated by `onto gen`
gates = ["ontology/shapes/gates.shacl.ttl"]             # hand-written graph gates
competency_questions = "ontology/cq"
work = "work"                                           # typed work items
decision_log = ".audit"
provenance = "prov"
base_ref = "origin/main"                                # what "this branch" is compared with

[guard]
# The ontology sources. Editing them needs an OntologyChangeRequest in progress.
protected = [
    "ontology/workflow.yaml",
    "ontology/domains/**",
    "ontology/shapes/gates.shacl.ttl",
]
# With an OntologyChangeRequest in progress: "ask" a person to confirm each edit, or "allow".
on_open_ocr = "ask"

# One table per bounded context. Adding one means adding a table here and a
# glossary under ontology/domains/.
[contexts.{{context}}]
schema = "ontology/domains/{{context}}.yaml"
paths = ["{{code_dir}}/**"]                             # the code this context governs
# The domain layer: only glossary vocabulary may be used or coined here.
domain_paths = ["{{domain_path}}"]
# Generated from the glossary by `onto gen`.
pydantic = "{{code_dir}}/generated.py"
json_schema = "{{code_dir}}/schemas/{{context}}.schema.json"
glossary_json = "{{code_dir}}/schemas/{{context}}.glossary.json"
