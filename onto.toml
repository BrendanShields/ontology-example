# The ontology layer of this monorepo: where it lives and which app each bounded
# context governs. Every `onto` command, every hook and CI read this one file.

[workflow]
schema = "ontology/workflow.yaml"                       # L1, shared by all apps
json_schema = "ontology/schemas/workflow.schema.json"   # generated by `onto gen`
shacl = "ontology/shapes/workflow.shacl.ttl"            # generated by `onto gen`
docs = "docs/generated/workflow.md"                     # generated by `onto gen` (optional)
gates = ["ontology/shapes/gates.shacl.ttl"]             # hand-written graph gates
competency_questions = "ontology/cq"
work = "work"                                           # typed work items
decision_log = ".audit"
provenance = "prov"
base_ref = "origin/main"                                # what "this branch" is compared with

[guard]
# The ontology sources. Editing them needs an OntologyChangeRequest in progress.
protected = [
    "ontology/workflow.yaml",
    "ontology/domains/**",
    "ontology/shapes/gates.shacl.ttl",
]
# With an OntologyChangeRequest in progress: "ask" a person to confirm each edit, or "allow".
on_open_ocr = "ask"

# One table per bounded context. Adding an app means adding a table here and a
# schema under ontology/domains/.
[contexts.call-qa]
schema = "ontology/domains/call-qa.yaml"                # L2
paths = ["apps/call-qa-agent/**"]                       # the app this context governs
# The domain layer: only glossary vocabulary may be used or coined here.
domain_paths = ["apps/call-qa-agent/src/call_qa_agent/domain/**"]
# Generated from the schema by `onto gen`.
pydantic = "apps/call-qa-agent/src/call_qa_agent/generated.py"
json_schema = "apps/call-qa-agent/src/call_qa_agent/schemas/call-qa.schema.json"
glossary_json = "apps/call-qa-agent/src/call_qa_agent/schemas/call-qa.glossary.json"
docs = "docs/generated/call-qa.md"                      # a page for people (optional)
