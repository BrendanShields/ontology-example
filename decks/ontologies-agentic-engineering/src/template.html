    <style>
      @font-face {

  <body>
    <script type="application/hyperframes-slideshow+json">
__ISLAND__
    </script>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="__TOTAL__"
      data-width="1920"
      data-height="1080"
    >
      <div id="stage" class="clip" data-start="0" data-duration="__TOTAL__" data-track-index="0">
        <div id="deck">
__SLIDES__
          <div id="rail" aria-hidden="true">
__RAIL__
            <b id="rail-tick"></b>
          </div>
          <div id="marker"></div>
        </div>
        <svg width="0" height="0" aria-hidden="true"><defs id="masks"></defs></svg>
      </div>
    </div>
    <script>
      function buildDeck() {
        var STEP = __STEP__;
        var HOME = { x: 120, y: 84, s: 10 };
        var NS = "http://www.w3.org/2000/svg";
        var slides = Array.prototype.slice.call(document.querySelectorAll("#deck .slide"));
        var marker = document.getElementById("marker");
        var railTick = document.getElementById("rail-tick");
        var masks = document.getElementById("masks");
        var master = gsap.timeline({ paused: true });

        var holds = [];
        slides.forEach(function (slide, si) {
          var n = Number(slide.dataset.holds);
          for (var b = 1; b <= n; b++) holds.push({ slide: slide, si: si, b: b });
        });
        var TOTAL = holds.length * STEP;

        function num(v, fallback) {
          return v == null || v === "" ? fallback : Number(v);
        }

        function locate(selector, dx, dy) {
          var frame = document.getElementById("root").getBoundingClientRect();
          var scale = frame.width / 1920;
          var box = document.querySelector(selector).getBoundingClientRect();
          return {
            x: (box.left + box.width / 2 - frame.left) / scale - 5 + (dx || 0),
            y: (box.top + box.height / 2 - frame.top) / scale - 5 + (dy || 0),
            s: box.width / scale,
          };
        }

        // A docked group is drawn at a nominal spot and pinned to a measured one.
        document.querySelectorAll("[data-dock]").forEach(function (el) {
          var spot = locate(el.dataset.dock);
          gsap.set(el, {
            x: spot.x + 5 - Number(el.dataset.dockX),
            y: spot.y + 5 - Number(el.dataset.dockY),
          });
        });

        function drawTarget(el, len) {
          if (!el.classList.contains("dash")) return el;
          var id = "mask-" + masks.childNodes.length;
          var mask = document.createElementNS(NS, "mask");
          mask.setAttribute("id", id);
          mask.setAttribute("maskUnits", "userSpaceOnUse");
          mask.setAttribute("x", "-200");
          mask.setAttribute("y", "-200");
          mask.setAttribute("width", "2320");
          mask.setAttribute("height", "1480");
          var clone = el.cloneNode(false);
          clone.removeAttribute("class");
          Object.keys(clone.dataset).forEach(function (key) {
            delete clone.dataset[key];
          });
          clone.setAttribute("fill", "none");
          clone.setAttribute("stroke", "#fff");
          clone.setAttribute("stroke-width", "14");
          mask.appendChild(clone);
          masks.appendChild(mask);
          el.setAttribute("mask", "url(#" + id + ")");
          return clone;
        }

        function enter(el, t) {
          var type = el.dataset.a;
          var dur = num(el.dataset.dur, null);
          if (type === "draw") {
            var len = el.getTotalLength();
            var target = drawTarget(el, len);
            var d = dur == null ? Math.min(0.9, Math.max(0.35, len / 1100)) : dur;
            gsap.set(target, { strokeDasharray: len + " " + (len + 2) });
            master.fromTo(
              target,
              { strokeDashoffset: len + 1 },
              { strokeDashoffset: 0, duration: d, ease: "power2.inOut" },
              t,
            );
            return t + d;
          }
          if (type === "snap") {
            master.fromTo(
              el,
              { opacity: 0, scale: 1.16, transformOrigin: "50% 50%" },
              { opacity: 1, scale: 1, duration: dur == null ? 0.22 : dur, ease: "power3.out" },
              t,
            );
            return t + (dur == null ? 0.22 : dur);
          }
          if (type === "zoom") {
            var zd = dur == null ? 1 : dur;
            master.fromTo(
              el,
              { opacity: 0, scale: 0.2, svgOrigin: el.dataset.origin },
              { opacity: 1, scale: 1, duration: zd, ease: "power3.out" },
              t,
            );
            return t + zd;
          }
          if (type === "pop") {
            master.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none" }, t);
            return t + 0.02;
          }
          if (type === "dots") {
            var each = dur == null ? 0.012 : dur;
            master.fromTo(
              el.children,
              { opacity: 0 },
              { opacity: 1, duration: 0.02, ease: "none", stagger: each },
              t,
            );
            return t + el.children.length * each + 0.02;
          }
          if (type === "sweep") {
            var sd = dur == null ? 1.1 : dur;
            master.fromTo(el, { opacity: 0 }, { opacity: 1, duration: 0.02, ease: "none" }, t);
            master.fromTo(
              el,
              { rotation: Number(el.dataset.from), svgOrigin: el.dataset.origin },
              { rotation: Number(el.dataset.to), duration: sd, ease: "power2.inOut" },
              t,
            );
            return t + sd;
          }
          var fd = dur == null ? 0.4 : dur;
          master.fromTo(el, { opacity: 0 }, { opacity: 1, duration: fd, ease: "power1.out" }, t);
          return t + fd;
        }

        function change(prev, next, prevIndex, nextIndex, t) {
          var leaving = prev.querySelectorAll(".hd .in");
          if (leaving.length) {
            master.fromTo(
              leaving,
              { yPercent: 0 },
              { yPercent: -112, duration: 0.45, ease: "power2.in", stagger: 0.04, immediateRender: false },
              t,
            );
          }
          master.fromTo(
            prev.querySelectorAll(".body, .ref"),
            { opacity: 1, x: 0 },
            { opacity: 0, x: -64, duration: 0.45, ease: "power2.in", immediateRender: false },
            t,
          );
          master.set(next, { autoAlpha: 1 }, t + 0.34);
          master.set(prev, { autoAlpha: 0 }, t + 0.52);
          master.fromTo(
            next.querySelectorAll(".hd .in"),
            { yPercent: 112 },
            { yPercent: 0, duration: 0.7, ease: "power3.out", stagger: 0.06 },
            t + 0.34,
          );
          var ref = next.querySelector(".ref");
          if (ref) {
            master.fromTo(ref, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power1.out" }, t + 0.75);
          }
          master.fromTo(
            railTick,
            { x: prevIndex * 14 },
            { x: nextIndex * 14, duration: 0.8, ease: "power3.inOut", immediateRender: false },
            t + 0.2,
          );
        }

        var pos = [];
        var activeEnd = [0];
        holds.forEach(function (hold, k) {
          var hit = k * STEP;
          var t0 = k === 0 ? 0 : (k - 1) * STEP + 0.05;
          var base = t0;
          var end = t0;
          if (k > 0 && hold.b === 1) {
            change(holds[k - 1].slide, hold.slide, holds[k - 1].si, hold.si, t0);
            base = t0 + 0.5;
            end = t0 + 1.3;
          }
          if (k > 0) {
            hold.slide.querySelectorAll('[data-x="' + hold.b + '"]').forEach(function (el) {
              var xt = base + num(el.dataset.xat, 0);
              if (el.dataset.xa === "zoom") {
                var focus = locate(el.dataset.on);
                var frame = document.getElementById("root").getBoundingClientRect();
                var box = el.getBoundingClientRect();
                var ratio = frame.width / 1920;
                var ox = focus.x + 5 - (box.left - frame.left) / ratio;
                var oy = focus.y + 5 - (box.top - frame.top) / ratio;
                master.fromTo(
                  el,
                  { scale: 1, opacity: 1, transformOrigin: ox + "px " + oy + "px" },
                  { scale: 1.8, opacity: 0, duration: 0.55, ease: "power2.in", immediateRender: false },
                  xt,
                );
                end = Math.max(end, xt + 0.55);
                return;
              }
              master.fromTo(
                el,
                { opacity: 1 },
                { opacity: 0, duration: 0.25, ease: "power1.in", immediateRender: false },
                xt,
              );
              end = Math.max(end, xt + 0.25);
            });
            hold.slide.querySelectorAll('[data-shift-b="' + hold.b + '"]').forEach(function (el) {
              var sd = num(el.dataset.shiftDur, 0.9);
              var st = base + num(el.dataset.shiftAt, 0);
              var sx = Number(el.dataset.shiftX);
              var sy = Number(el.dataset.shiftY);
              if (el.dataset.shiftTo) {
                var from = locate(el.dataset.shiftFrom);
                var goal = el.dataset.shiftTo.split(",").map(Number);
                sx = goal[0] - (from.x + 5);
                sy = goal[1] - (from.y + 5);
              }
              master.fromTo(
                el,
                { x: 0, y: 0 },
                {
                  x: sx,
                  y: sy,
                  duration: sd,
                  ease: "power3.inOut",
                  immediateRender: false,
                },
                st,
              );
              end = Math.max(end, st + sd);
            });
            hold.slide
              .querySelectorAll('[data-b="' + hold.b + '"]:not(.mk)')
              .forEach(function (el) {
                end = Math.max(end, enter(el, base + num(el.dataset.at, 0)));
              });
          }
          // A hold can move the dot in several legs: one .mk anchor per leg, in document order.
          var anchors = Array.prototype.slice.call(
            hold.slide.querySelectorAll('.mk[data-b="' + hold.b + '"]'),
          );
          var from = k > 0 ? pos[k - 1] : null;
          (anchors.length ? anchors : [null]).forEach(function (anchor, leg) {
            var p = !anchor
              ? hold.b === 1
                ? HOME
                : pos[k - 1]
              : anchor.dataset.on
                ? locate(anchor.dataset.on, num(anchor.dataset.dx, 0), num(anchor.dataset.dy, 0))
                : {
                    x: Number(anchor.getAttribute("x")),
                    y: Number(anchor.getAttribute("y")),
                    s: num(anchor.dataset.s, 10),
                  };
            if (k > 0 && (p.x !== from.x || p.y !== from.y || p.s !== from.s)) {
              // On a slide change the dot leaves at once and lands as the new body starts to
              // draw, so it is already where the eye should go.
              var lead = hold.b === 1 && leg === 0;
              var at = lead ? t0 + 0.02 : base + num(anchor && anchor.dataset.at, 0.1);
              var md = lead
                ? 0.48
                : num(anchor && anchor.dataset.dur, anchor && anchor.dataset.snap != null ? 0.26 : 0.6);
              var to = {
                x: p.x,
                y: p.y,
                scale: p.s / 10,
                duration: md,
                ease: "power3.inOut",
                immediateRender: false,
              };
              if (anchor && anchor.dataset.via) {
                var route = [from]
                  .concat(
                    anchor.dataset.via.split(";").map(function (pair) {
                      var xy = pair.split(",");
                      return { x: Number(xy[0]) - 5, y: Number(xy[1]) - 5 };
                    }),
                  )
                  .concat([p]);
                var lengths = [0];
                for (var i = 1; i < route.length; i++) {
                  lengths.push(
                    lengths[i - 1] + Math.hypot(route[i].x - route[i - 1].x, route[i].y - route[i - 1].y),
                  );
                }
                var frames = { easeEach: "none" };
                route.forEach(function (point, i) {
                  frames[((lengths[i] / lengths[lengths.length - 1]) * 100).toFixed(3) + "%"] = {
                    x: point.x,
                    y: point.y,
                  };
                });
                to = { keyframes: frames, duration: md, ease: "power2.inOut", immediateRender: false };
              }
              master.fromTo(marker, { x: from.x, y: from.y, scale: from.s / 10 }, to, at);
              // data-hide="a,b" hides the dot between those fractions of the leg's length, so it
              // can pass behind something. The times undo the leg's ease.
              if (anchor && anchor.dataset.hide) {
                var power = anchor.dataset.via ? 3 : 4;
                var when = function (f) {
                  if (f <= 0) return 0;
                  if (f >= 1) return 1;
                  return f < 0.5
                    ? Math.pow(f / Math.pow(2, power - 1), 1 / power)
                    : 1 - Math.pow(2 * (1 - f), 1 / power) / 2;
                };
                var span = anchor.dataset.hide.split(",").map(Number);
                master.set(marker, { opacity: 0 }, at + md * when(span[0]));
                master.set(marker, { opacity: 1 }, at + md * when(span[1]));
              }
              end = Math.max(end, at + md);
            }
            from = p;
          });
          pos.push(from);
          if (k > 0 && end > hit - 0.05) {
            console.warn("[deck] " + hold.slide.id + " beat " + hold.b + " runs " + (end - t0).toFixed(2) + " s");
          }
          activeEnd.push(Math.min(end, hit));
        });
        activeEnd.shift();
        activeEnd[0] = 0;
        // Pad to the full length so the last hold is a time the playhead can reach.
        master.set({}, {}, TOTAL);
        gsap.set(marker, { x: pos[0].x, y: pos[0].y, scale: pos[0].s / 10 });
        gsap.set(slides[0], { autoAlpha: 1 });

        var glide = false;
        try {
          glide =
            window.parent !== window &&
            !!window.parent.document.querySelector("hyperframes-slideshow");
        } catch (err) {
          glide = false;
        }
        var shown = 0;
        var tween = null;
        var watchdog = null;

        function holdAt(t) {
          var k = Math.round(t / STEP);
          return Math.abs(t - k * STEP) < 0.06 && k >= 0 && k < holds.length ? k : -1;
        }

        function show(t) {
          if (!glide) {
            master.time(t);
            shown = t;
            return;
          }
          if (Math.abs(t - shown) < 0.001) return;
          var from = shown;
          shown = t;
          clearTimeout(watchdog);
          if (tween) {
            tween.kill();
            tween = null;
            master.time(from);
          }
          var j = holdAt(from);
          var k = holdAt(t);
          if (j >= 0 && k === j + 1 && !document.hidden) {
            var start = j * STEP + 0.05;
            var stop = Math.max(start + 0.05, activeEnd[k]);
            master.time(start);
            tween = gsap.to(master, {
              time: stop,
              duration: stop - start,
              ease: "none",
              onComplete: function () {
                tween = null;
                master.time(t);
              },
            });
            // A throttled or covered window stops animation frames, so land on the hold anyway.
            watchdog = setTimeout(function () {
              if (tween) tween.progress(1);
            }, (stop - start) * 1000 + 600);
            return;
          }
          master.time(t);
          gsap.fromTo(
            "#deck",
            { opacity: 0 },
            { opacity: 1, duration: 0.35, ease: "power1.out", overwrite: true },
          );
        }

        // Idle motion runs on the browser clock, so it exists only in the presenter.
        // Seeked renders and checks never start it and stay deterministic.
        if (glide) {
          var idlers = Array.prototype.slice.call(document.querySelectorAll("[data-idle]")).map(function (el) {
            var origin = (el.dataset.origin || "0 0").split(" ").map(Number);
            var kids = Array.prototype.slice.call(el.children);
            return {
              el: el,
              type: el.dataset.idle,
              slide: el.closest(".slide"),
              from: num(el.dataset.b, 1),
              until: num(el.dataset.x, Infinity),
              amp: num(el.dataset.amp, 0),
              phase: num(el.dataset.phase, 0),
              every: num(el.dataset.every, 0),
              origin: origin,
              kids: kids,
            };
          });
          // The robot's own idle: wink, look, think and sway. Nothing here repeats on a fixed
          // beat. Each face draws its timing from its own seeded sequence, and its eyes follow
          // the orange dot when the dot is somewhere else.
          var faces = {};
          var faceOf = function (it, seed) {
            var key = it.el.dataset.face || "solo" + seed;
            if (!faces[key]) {
              var a = (seed * 7919 + 101) >>> 0;
              faces[key] = {
                lid: 1,
                gx: 0,
                gy: 0,
                tx: 0,
                ty: 0,
                roll: function () {
                  a = (a + 0x6d2b79f5) >>> 0;
                  var t = a;
                  t = Math.imul(t ^ (t >>> 15), t | 1);
                  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
                  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
                },
              };
            }
            return faces[key];
          };
          idlers.forEach(function (it, i) {
            it.face = faceOf(it, i + 1);
            it.tempo = it.el.dataset.tempo || "calm";
            it.rest = num(it.el.dataset.rest, 0.3);
          });
          var liveFace = function (face, it, now) {
            if (face.tick === now) return;
            face.tick = now;
            if (face.blinkNext == null) {
              face.blinkNext = now + 0.6 + face.roll() * 3;
              face.gazeNext = now + 0.4 + face.roll() * 1.5;
            }
            if (now >= face.blinkNext) {
              face.blinkAt = now;
              face.twice = face.roll() < 0.2;
              face.blinkNext = now + 2.2 + face.roll() * 4.6;
            }
            var u = face.blinkAt == null ? 9 : (now - face.blinkAt) / 0.15;
            var shut = u < 1 ? u : face.twice && u > 1.5 && u < 2.5 ? u - 1.5 : -1;
            face.lid = shut < 0 ? 1 : 1 - 0.92 * Math.sin(Math.PI * shut);

            var frame = document.getElementById("root").getBoundingClientRect();
            var scale = frame.width / 1920;
            var box = it.el.getBoundingClientRect();
            var dx = Number(gsap.getProperty(marker, "x")) + 5 - (box.left + box.width / 2 - frame.left) / scale;
            var dy = Number(gsap.getProperty(marker, "y")) + 5 - (box.top + box.height / 2 - frame.top) / scale;
            var far = Math.hypot(dx, dy);
            if (now >= face.gazeNext) {
              face.watch = far > 150 && face.roll() < (it.tempo === "stare" ? 1 : 0.65);
              if (!face.watch) {
                var turnTo = face.roll() * Math.PI * 2;
                var reach = face.roll() < 0.25 ? 0 : 0.4 + face.roll() * 0.6;
                face.tx = Math.cos(turnTo) * reach;
                face.ty = Math.sin(turnTo) * reach;
              }
              face.gazeNext = now + (it.tempo === "fast" ? 0.35 + face.roll() * 0.9 : 0.9 + face.roll() * 2.6);
            }
            if (face.watch && far > 1) {
              face.tx = dx / far;
              face.ty = dy / far;
            }
            face.gx += (face.tx - face.gx) * 0.2;
            face.gy += (face.ty - face.gy) * 0.2;
          };

          gsap.ticker.add(function () {
            var now = gsap.ticker.time;
            var hold = holds[holdAt(shown)];
            if (!hold) return;
            idlers.forEach(function (it) {
              if (it.slide !== hold.slide) return;
              if (it.type === "wink") {
                gsap.set(it.el, { scaleY: it.face.lid, svgOrigin: it.origin[0] + " " + it.origin[1] });
              } else if (it.type === "look") {
                liveFace(it.face, it, now);
                gsap.set(it.el, { x: it.face.gx * it.amp, y: it.face.gy * it.amp * 0.7 });
              } else if (it.type === "think") {
                var busy = !tween && hold.b >= it.from && hold.b < it.until;
                if (it.nextThought == null || now >= it.nextThought) {
                  var pause = it.face.roll() < 0.3;
                  it.thought = pause ? -1 : Math.floor(it.face.roll() * it.kids.length);
                  it.nextThought = now + (pause ? 0.3 + it.face.roll() * it.rest : 0.16 + it.face.roll() * 0.5);
                }
                it.kids.forEach(function (kid, i) {
                  kid.style.opacity = busy && i === it.thought ? "1" : "0";
                });
              } else if (it.type === "sway") {
                gsap.set(it.el, {
                  rotation: it.amp * (0.62 * Math.sin(now * 0.83 + it.phase) + 0.38 * Math.sin(now * 1.61 + it.phase * 2.1)),
                  svgOrigin: it.origin[0] + " " + it.origin[1],
                });
              } else if (it.type === "blink") {
                // data-every and data-phase let several faces on one slide blink out of step.
                gsap.set(it.el, {
                  scaleY: (now + it.phase) % (it.every || 3.9) < 0.13 ? 0.08 : 1,
                  svgOrigin: it.origin[0] + " " + it.origin[1],
                });
              } else if (it.type === "mouth") {
                // Two slow waves that never line up, so a mouth keeps moving a little without looping visibly.
                var turnOf = ((now + it.phase) / (it.every || 2.6)) * 2 * Math.PI;
                gsap.set(it.el, {
                  scaleX: 1 + it.amp * Math.sin(turnOf),
                  scaleY: 1 + it.amp * 1.5 * Math.sin(turnOf * 0.63 + 1.1),
                  svgOrigin: it.origin[0] + " " + it.origin[1],
                });
              } else if (it.type === "glance") {
                var looks = [0, -1, 0, 1, 0, 0];
                var turn = Math.floor(now / 2.2);
                var f = Math.min(1, (now / 2.2 - turn) / 0.1);
                var was = looks[(turn + 5) % 6];
                gsap.set(it.el, { x: it.amp * (was + (looks[turn % 6] - was) * f * f * (3 - 2 * f)) });
              } else if (it.type === "hop") {
                var live = !tween && hold.b >= it.from && hold.b < it.until;
                var slot = Math.floor(now / 0.5);
                var pick = (slot * 7 + (slot % 3) * 4) % it.kids.length;
                it.kids.forEach(function (kid, i) {
                  kid.style.opacity = live && i === pick && now / 0.5 - slot < 0.8 ? "1" : "0";
                });
              }
            });
          });
        }

        document.addEventListener("visibilitychange", function () {
          if (document.hidden && tween) tween.progress(1);
        });

        var clock = {
          get t() {
            return shown;
          },
          set t(value) {
            show(value);
          },
        };
        var tl = gsap.timeline({ paused: true });
        tl.fromTo(clock, { t: 0 }, { t: TOTAL, duration: TOTAL, ease: "none" }, 0);
        window.__deck = { master: master, holds: holds.length, step: STEP, activeEnd: activeEnd };
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        tl.seek(0);
      }
      // The marker starts on a glyph of the headline, so wait for that face before measuring.
      (document.fonts && document.fonts.load
        ? document.fonts.load('600 116px "Inter"')
        : Promise.resolve()
      ).then(buildDeck, buildDeck);
    </script>
  </body>
</html>
