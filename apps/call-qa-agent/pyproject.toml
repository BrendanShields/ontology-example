[project]
name = "call-qa-agent"
version = "0.1.0"
description = "An AI agent that evaluates recorded customer calls against a scorecard"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "pyyaml>=6",
]

[project.scripts]
call-qa = "call_qa_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/call_qa_agent"]
